<div class="teachers-page">
  <div class="page-header">
    <h1>Enseignants</h1>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef>Prénom</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.firstName }}</td>
        </ng-container>

        <ng-container matColumnDef="lastName">
          <th mat-header-cell *matHeaderCellDef>Nom</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.email }}</td>
        </ng-container>

        <ng-container matColumnDef="specialization">
          <th mat-header-cell *matHeaderCellDef>Spécialisation</th>
          <td mat-cell *matCellDef="let teacher">{{ teacher.specialization }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let teacher">
            @if (teacher.isApproved) {
              <span class="status-badge approved">Approuvé</span>
            } @else {
              <span class="status-badge pending">En attente</span>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="dataSource.data.length === 0" class="no-data">
        Aucun enseignant trouvé
      </div>

      <mat-paginator
        [length]="totalElements"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange($event)">
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
