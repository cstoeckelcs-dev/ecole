<div class="login-page">
  <div class="login-card card">
    <div class="card-body">
      <div class="logo">
        <i class="fas fa-graduation-cap fa-3x text-primary"></i>
        <h2 class="mt-3">Ecole</h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="Enter your email">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100 mt-3">
          <mat-label>Password</mat-label>
          <input matInput 
                 formControlName="password" 
                 [type]="hidePassword ? 'password' : 'text'"
                 placeholder="Enter your password">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 8 characters
          </mat-error>
        </mat-form-field>

        <div class="d-grid gap-2 mt-4">
          <button mat-raised-button 
                  color="primary"
                  type="submit"
                  [disabled]="loginForm.invalid || loginForm.pristine"
                  class="btn-login">
            <ngx-spinner *ngIf="false" bdColor="rgba(255,255,255,0.3)" size="small" color="#ffffff" type="ball-scale-multiple"></ngx-spinner>
            <span *ngIf="true">Login</span>
          </button>
        </div>

        <div class="divider my-3">
          <span>or</span>
        </div>

        <div class="social-login">
          <button mat-fab color="primary" (click)="loginWithGoogle()" type="button">
            <mat-icon svgIcon="google"></mat-icon>
          </button>
        </div>

        <div class="forgot-password">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <div class="register-link">
          Don't have an account? <a routerLink="/register">Register</a>
        </div>
      </form>
    </div>
  </div>
</div>
